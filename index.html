async function sync0(q){const c=S.cfg;if(!q){c.pid=$('#fb1').value.trim();c.key=$('#fb2').value.trim();c.code=$('#fb3').value.trim();c.em=$('#fb4').value.trim()}save();const pw=q?'':($('#fb5')||{}).value;const out=t=>{const e=$('#sm');if(e)e.textContent=t};

  for(const [id,v] of docs){if(id=='sh'){for(const k in v)S.shops[k]={...v[k],...(S.shops[k]||{})}}else if(id=='cf'){if(v.u>S.cf.u)S.cf=Object.assign(CFD(),v)}else if(id=='pl'){for(const k in v)if(!S.plans[k]||v[k].u>S.plans[k].u)S.plans[k]=v[k]}else{const ty=id.split('_')[0];if(!S[ty])continue;const mp=new Map(S[ty].map(x=>[x.k,x]));v.forEach(r=>{const o=mp.get(r.k);if(!o||r.u>o.u)mp.set(r.k,r)});S[ty]=[...mp.values()]}}
  out('Invio…');const put=(id,o)=>fetch(`${B}/${id}?${K}`,{method:'PATCH',headers:H,body:JSON.stringify({fields:{d:{stringValue:JSON.stringify(o)}}})}).then(r=>{if(!r.ok)throw new Error(r.status)});
  const jobs=[put('sh',S.shops),put('pl',S.plans),put('cf',S.cf)];['nip','en','tp','as','pd'].forEach(ty=>{for(let i=0;i*250<S[ty].length;i++)jobs.push(put(ty+'_'+i,S[ty].slice(i*250,i*250+250)))});await Promise.all(jobs);

 if(pw){r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?'+K,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:c.em,password:pw,returnSecureToken:true})});j=await r.json();if(!r.ok)throw new Error('email o password errate');c.rt=j.refreshToken;save();return j.idToken}
