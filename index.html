const LOG=[['6.7','12/11/2026',['Soglie › «Soglie e miei target»: soglia 1 e 2 dell\'energia per insegna, il tuo target per ogni negozio, attivati, in lavorazione e annullati, totali e quanto manca al totale del tuo premio; pulsante nella Home']],['6.6','09/11/2026',['Piano e scheda negozio: nella colonna «Soglie» sono scritte tutte le soglie della gara (1ª · 2ª · 3ª · 4ª), con quelle raggiunte in verde']],['6.5','09/11/2026',['Blocco automatico più lungo: di base 30 minuti, si può scegliere fino a 8 ore (Dati › Sicurezza)']],['6.4','09/11/2026',['Gara accessi di Franchisee e Monobrand: contano anche le linee Business fisso del negozio, fino al 40% delle linee Consumer, solo per raggiungere la soglia (non pagate con il gettone), come da lettera','Il riquadro dei CSV legge il file del Fisso Business (con «business» nel nome) e lo mostra in Dati in uso']],['6.3','09/11/2026',['Home: «In 10 secondi» con il riassunto del periodo e «Cosa è cambiato dall\'ultima volta» (dati nuovi, pezzi e annullati in più, insegne che cambiano soglia)','Intestazioni delle tabelle fisse sotto la barra blu mentre scorri, prima colonna sempre visibile; barra del periodo compatta in alto quando scorri','«Come si legge» in tutte le schermate; nomi per esteso nelle colonne (TPASS = Telepass, PAF invariato); simboli ✔ ◐ ✖ insieme ai colori','Negozi e insegne: colonne essenziali o tutte; sul telefono schede al posto delle tabelle larghe','Stato delle insegne: ✔ in linea, ⚠ a rischio, ⏸ ferma; barre di avanzamento con le tacche delle soglie','Scaletta delle soglie per insegna e negozio (pezzi che mancano, € in più, effetto sul bonus addizionale), anche nel Piano come «Prossima soglia»','Accessi di Franchisee e Monobrand valorizzati in canoni (premio della lettera × canone medio, 23 € se non indicato)','Assicurazioni: gettone = premio del CSV × moltiplicatore delle soglie compensi','Insegne con negozi Franchisee e Monobrand insieme: un\'unica insegna nella pista della tipologia più numerosa','Sogl
